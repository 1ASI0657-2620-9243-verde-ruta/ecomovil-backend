spring.application.name=safety-service

server.port=8083

# ==========================================
# PostgreSQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecomovil}
spring.datasource.username=${DB_USER:ecomovil}
spring.datasource.password=${DB_PASSWORD:ecomovil123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# MQTT
# ==========================================

mqtt.broker=${MQTT_BROKER_URL:tcp://localhost:1883}

mqtt.topic=ecomovil/vehicles/+/telemetry

mqtt.client-id=ecomovil-safety-service

# ==========================================
# Safety rules
# ==========================================

safety.speed-limit=25.0
safety.gyro-threshold=2.5
spring.application.name=safety-service

server.port=8083

# ==========================================
# PostgreSQL
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/ecomovil
spring.datasource.username=ecomovil
spring.datasource.password=ecomovil123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# MQTT
# ==========================================

mqtt.broker=tcp://localhost:1883

mqtt.topic=ecomovil/vehicles/+/telemetry

mqtt.client-id=ecomovil-safety-service

# ==========================================
# Safety rules
# ==========================================

safety.speed-limit=25.0
safety.gyro-threshold=2.5
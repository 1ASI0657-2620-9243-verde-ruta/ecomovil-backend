spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: "*"
                allowed-methods: "*"
                allowed-headers: "*"
                allow-credentials: false
                max-age: 3600

          routes:

            - id: vehicle-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/vehicles/**

            - id: telemetry-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/telemetry/**

            - id: safety-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/safety/**

            - id: access-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/access/**

            - id: reservation-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/reservations/**

            - id: iam-auth-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/auth/**

            - id: iam-user-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/users/**

server:
  port: 8080

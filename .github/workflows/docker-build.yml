name: Docker build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar imágenes de todos los servicios
        working-directory: ecomovil-infra
        run: docker compose -f docker-compose.prod.yml build
